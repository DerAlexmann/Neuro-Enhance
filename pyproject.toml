[project]
name = "silberkorn"
version = "0.4.1"
description = "An open-source, GPU-accelerated AI image & photo enhancer powered by neural networks."
readme = "README.en.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Alexander Unverhau" }]
keywords = [
    "image-enhancer", "upscaler", "ai", "cuda", "gpu-acceleration", "deep-learning",
    "super-resolution", "denoising", "photo-editing", "raw", "16-bit",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Editors :: Raster-Based",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "PySide6>=6.8",
    "nvidia-ml-py>=12.570",
    "Pillow>=11",
    "numpy>=1.26",
    "tifffile>=2024.1",
    "imagecodecs>=2024.1",
    "rawpy>=0.21",
    "cupy-cuda12x[ctk]>=14",
    "cuda-toolkit==12.8.*",
    "onnxruntime-gpu==1.26.*",
    "nvidia-cudnn-cu12==9.10.*",
    "onnx>=1.17",
]

[project.optional-dependencies]
heif = ["pillow-heif"]
# Aus https://pypi.nvidia.com - siehe requirements-tensorrt.txt
tensorrt = ["tensorrt-cu12-libs==10.14.*"]

[project.urls]
Homepage = "https://github.com/DerAlexmann/Silberkorn"
Issues = "https://github.com/DerAlexmann/Silberkorn/issues"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-include = ["*.pyw"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle - Fehler
    "W",    # pycodestyle - Warnungen
    "F",    # Pyflakes
    "I",    # isort - Importreihenfolge
    "B",    # flake8-bugbear - typische Fallstricke
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade - veraltete Schreibweisen
    "RET",  # flake8-return
]
ignore = [
    # Die Farbnamen (BG, CARD, TEXT ...) legt apply_theme() zur Laufzeit als
    # Modulvariablen an; Ruff sieht sie deshalb als undefiniert an.
    "F821",
]
