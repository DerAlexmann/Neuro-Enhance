name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stil:
    name: Stil (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # Die Läufer haben keine Grafikkarte. Geprüft werden die Bewertung der
      # Karten, die Startmeldungen und die Sprachtabelle - dafür braucht es
      # weder Qt noch CUDA. Ohne Treiber meldet NVML "nicht gefunden", und
      # genau das muss die Startprüfung ohne Absturz verkraften.
      - run: pip install pytest nvidia-ml-py
      - run: python -m pytest tests -q
